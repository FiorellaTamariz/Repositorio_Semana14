# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - strappfatp

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to container registry
        uses: docker/login-action@v2
        with:
          registry: crafatp.azurecr.io/
          username: ${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_35E2BB01575F4A99B7EE369EED54D4C0 }}
          password: ${{ secrets.AZUREAPPSERVICE_CONTAINERPASSWORD_C69AC29C9FFB4BE8B39E90C0754164BF }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: crafatp.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_35E2BB01575F4A99B7EE369EED54D4C0 }}/strappdocker:${{ github.sha }}
          file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    
    needs: build
    
    steps:
      
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'strappfatp'
          slot-name: 'Production'
          images: 'crafatp.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_35E2BB01575F4A99B7EE369EED54D4C0 }}/strappdocker:${{ github.sha }}'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_5322B65967764F3794263E3DA929AEAE }}